spring.application.name=emprendimientos-sid

# ── PostgreSQL — Supabase ─────────────────────────────────────────
# Transaction Pooler — IPv4 compatible (puerto 6543)
# prepareThreshold=0: deshabilita prepared statements (requerido para PgBouncer Transaction Pooler)
spring.datasource.url=jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:6543/postgres?prepareThreshold=0
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres.bttfputfgjennlmmcnvp
spring.datasource.password=IcesiEmprende

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Transaction Pooler no soporta DDL — usamos 'none' y creamos el schema manualmente
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=false
spring.jpa.show-sql=false

# No cargar data.sql automáticamente — el schema ya existe en Supabase
spring.sql.init.mode=never

spring.h2.console.enabled=false

# ── MongoDB — Atlas ───────────────────────────────────────────────
spring.data.mongodb.uri=mongodb+srv://ximenagg2002_db_user:IcesiEmprende@cluster0.wfy2enh.mongodb.net/Sid?retryWrites=true&w=majority
spring.data.mongodb.database=Sid

# ── Servidor ──────────────────────────────────────────────────────
server.port=8081

# ── JWT ───────────────────────────────────────────────────────────
