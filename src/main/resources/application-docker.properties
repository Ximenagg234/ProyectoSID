spring.application.name=emprendimientos

# ── PostgreSQL (contenedor "db") ───────────────────────────────────
spring.datasource.url=jdbc:postgresql://db:5432/emprendimientos
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false

# Carga explícitamente data-postgres.sql (no data.sql)
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-postgres.sql

# Deshabilitar consola H2
spring.h2.console.enabled=false

# ── Servidor ───────────────────────────────────────────────────────
server.port=8081

# ── Seguridad JWT ──────────────────────────────────────────────────
app.security.secretkey=7a3f9c2e1b8d4f6a0e5c7b9d2f4a6e8c1b3d5f7a9e2c4b6d8f0a2e4c6b8d0f2
app.security.expirationMinutes=60

# ── Uploads ────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
app.uploads.dir=/app/uploads
