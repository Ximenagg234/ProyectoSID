<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<div th:fragment="contenido">

    <div class="page-header">
        <h1>Productos y Servicios</h1>
        <p>Catálogo de ofertas publicadas por los emprendedores Icesi</p>
    </div>

    <div class="card-custom">

        <div class="section-header">
            <div class="section-header-info">
                <h2>Catálogo de emprendimientos</h2>
                <p>Productos y servicios disponibles en el campus</p>
            </div>
            <a th:href="@{/productos/nuevo}"
               class="btn btn-primary"
               sec:authorize="hasAuthority('CREAR_PRODUCTO')">
                <i class="bi bi-plus-lg"></i>
                Publicar Producto
            </a>
        </div>

        <div class="table-wrapper">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>Producto / Servicio</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th style="width:130px; text-align:right;">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${productos}">
                    <td>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <div style="width:34px; height:34px; background:#DCFCE7; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#22C55E; font-size:15px; flex-shrink:0;">
                                <i class="bi bi-bag-fill"></i>
                            </div>
                            <span style="font-weight:600;" th:text="${p.nombre}"></span>
                        </div>
                    </td>
                    <td>
                            <span style="font-weight:700; color:#111827;">
                                $<span th:text="${p.precio}"></span>
                            </span>
                    </td>
                    <td>
                            <span style="display:inline-flex; align-items:center; gap:5px; padding:3px 12px; background:#F3F4F6; border-radius:50px; font-size:12px; font-weight:600; color:#6B7280;"
                                  th:text="${p.stockDisponible}">
                            </span>
                    </td>
                    <td style="text-align:right;">
                        <a th:href="@{'/productos/eliminar/' + ${p.idProducto}}"
                           class="btn btn-outline-danger btn-sm"
                           sec:authorize="hasAuthority('ELIMINAR_PRODUCTO')">
                            <i class="bi bi-trash3"></i>
                            Eliminar
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>

</div>

</body>
</html>
