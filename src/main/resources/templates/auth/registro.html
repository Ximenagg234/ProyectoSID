<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Registro — IcesiEmprende</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif; box-sizing: border-box; }
        body { background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { border-radius: 20px; border: none; box-shadow: 0 20px 60px rgba(0,0,0,.2); padding: 40px; max-width: 520px; width: 100%; }
        .form-control { border-radius: 10px; border: 1.5px solid #E5E7EB; padding: 10px 14px 10px 40px; font-size: 14px; }
        .form-control:focus { border-color: #6366F1; box-shadow: 0 0 0 3px rgba(99,102,241,.15); }
        .btn-primary { background: #6366F1; border: none; border-radius: 10px; padding: 12px 20px; font-weight: 700; font-size: 14px; width: 100%; }
        .btn-primary:hover { background: #4F46E5; }
        .role-card { border: 2px solid #E5E7EB; border-radius: 12px; padding: 14px 16px; cursor: pointer; transition: all .2s; }
        .role-card:has(input:checked) { border-color: #6366F1; background: #EEF2FF; }
    </style>
</head>
<body>
<div class="card">
    <div style="text-align:center; margin-bottom:28px;">
        <div style="width:52px;height:52px;background:linear-gradient(135deg,#6366F1,#8B5CF6);
                    border-radius:14px;display:flex;align-items:center;justify-content:center;
                    margin:0 auto 12px;">
            <i class="bi bi-rocket-takeoff-fill" style="font-size:24px;color:#fff;"></i>
        </div>
        <h4 style="font-weight:800;color:#111827;margin:0;">Únete a IcesiEmprende</h4>
        <p style="color:#6B7280;font-size:13px;margin-top:4px;">Crea tu cuenta y empieza a emprender o a comprar</p>
    </div>

    <form th:action="@{/registro}" th:object="${usuario}" method="post">

        <!-- Nombre -->
        <div style="position:relative;margin-bottom:14px;">
            <span style="position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#9CA3AF;">
                <i class="bi bi-person"></i>
            </span>
            <input type="text" th:field="*{nombreCompleto}" class="form-control"
                   placeholder="Nombre completo" required/>
        </div>

        <!-- Correo -->
        <div style="position:relative;margin-bottom:14px;">
            <span style="position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#9CA3AF;">
                <i class="bi bi-envelope"></i>
            </span>
            <input type="email" th:field="*{correoInstitucional}" class="form-control"
                   placeholder="correo@icesi.edu.co" required/>
        </div>

        <!-- Programa y semestre -->
        <div style="display:flex;gap:10px;margin-bottom:14px;">
            <div style="flex:2;position:relative;">
                <input type="text" th:field="*{programaAcademico}" class="form-control"
                       style="padding-left:14px;" placeholder="Programa académico" required/>
            </div>
            <div style="flex:1;position:relative;">
                <input type="number" th:field="*{semestreAcademico}" class="form-control"
                       style="padding-left:14px;" placeholder="Sem." min="1" max="12" required/>
            </div>
        </div>

        <!-- Contraseña -->
        <div style="position:relative;margin-bottom:20px;">
            <span style="position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#9CA3AF;">
                <i class="bi bi-lock"></i>
            </span>
            <input type="password" th:field="*{clave}" class="form-control"
                   placeholder="Contraseña" required/>
        </div>

        <!-- Selección de rol -->
        <div style="margin-bottom:20px;">
            <p style="font-size:13px;font-weight:700;color:#374151;margin-bottom:10px;">
                ¿Cómo quieres usar la plataforma?
            </p>
            <div style="display:flex;gap:10px;flex-wrap:wrap;">
                <label class="role-card" style="flex:1;min-width:130px;">
                    <input type="checkbox" name="roles" value="3" style="display:none;"/>
                    <div style="display:flex;align-items:center;gap:8px;">
                        <i class="bi bi-cart3" style="font-size:20px;color:#6366F1;"></i>
                        <div>
                            <div style="font-size:13px;font-weight:700;color:#111827;">Comprador</div>
                            <div style="font-size:11px;color:#6B7280;">Explorar y comprar</div>
                        </div>
                    </div>
                </label>
                <label class="role-card" style="flex:1;min-width:130px;">
                    <input type="checkbox" name="roles" value="2" style="display:none;"/>
                    <div style="display:flex;align-items:center;gap:8px;">
                        <i class="bi bi-rocket-takeoff" style="font-size:20px;color:#16A34A;"></i>
                        <div>
                            <div style="font-size:13px;font-weight:700;color:#111827;">Emprendedor</div>
                            <div style="font-size:11px;color:#6B7280;">Vender productos</div>
                        </div>
                    </div>
                </label>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-lg"></i> Crear cuenta
        </button>

        <p style="text-align:center;margin-top:16px;font-size:13px;color:#6B7280;">
            ¿Ya tienes cuenta?
            <a th:href="@{/login}" style="color:#6366F1;font-weight:600;text-decoration:none;">Inicia sesión</a>
        </p>
    </form>
</div>
</body>
</html>
