<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<div th:fragment="contenido">

    <!-- Page Header -->
    <div class="page-header">
        <h1>Panel de Emprendimientos</h1>
        <p>Resumen de la actividad de la plataforma — Universidad Icesi</p>
    </div>

    <!-- Metric Cards -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="metric-card">
                <div class="metric-icon" style="background:#EEF2FF; color:#6366F1;">
                    <i class="bi bi-person-badge-fill"></i>
                </div>
                <div>
                    <div class="metric-title">Estudiantes</div>
                    <div class="metric-value" th:text="${usuarios.size()}">0</div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="metric-card">
                <div class="metric-icon" style="background:#DCFCE7; color:#22C55E;">
                    <i class="bi bi-bag-fill"></i>
                </div>
                <div>
                    <div class="metric-title">Productos</div>
                    <div class="metric-value" th:text="${productos.size()}">0</div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="metric-card">
                <div class="metric-icon" style="background:#FEF3C7; color:#D97706;">
                    <i class="bi bi-shield-fill-check"></i>
                </div>
                <div>
                    <div class="metric-title">Roles</div>
                    <div class="metric-value" th:text="${roles.size()}">0</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Students Table -->
    <div class="card-custom">
        <div class="section-header">
            <div class="section-header-info">
                <h2>Estudiantes registrados</h2>
                <p>Emprendedores activos en la plataforma</p>
            </div>
            <a th:href="@{/usuarios/nuevo}" class="btn btn-primary">
                <i class="bi bi-plus-lg"></i>
                Nuevo Estudiante
            </a>
        </div>

        <div class="table-wrapper">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>Estudiante</th>
                    <th style="width:200px; text-align:right;">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${usuarios}">
                    <td>
                        <div style="display:flex; align-items:center; gap:12px;">
                            <div style="width:36px; height:36px; background:#EEF2FF; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#6366F1; font-size:14px; font-weight:700; flex-shrink:0;">
                                <i class="bi bi-person-fill"></i>
                            </div>
                            <div>
                                <div style="font-weight:600; color:#111827;" th:text="${u.nombreCompleto}"></div>
                                <div style="font-size:12px; color:#6B7280;">Emprendedor Icesi</div>
                            </div>
                        </div>
                    </td>
                    <td style="text-align:right;">
                        <div style="display:flex; gap:6px; justify-content:flex-end;">
                            <a th:href="@{'/usuarios/asignar-roles/' + ${u.idUsuario}}"
                               class="btn btn-outline-primary btn-sm"
                               sec:authorize="hasRole('ADMIN')">
                                <i class="bi bi-shield"></i>
                                Roles
                            </a>
                            <a th:href="@{'/usuarios/eliminar/' + ${u.idUsuario}}"
                               class="btn btn-outline-danger btn-sm">
                                <i class="bi bi-trash3"></i>
                                Eliminar
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>
