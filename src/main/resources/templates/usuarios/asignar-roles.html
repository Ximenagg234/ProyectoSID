<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<div th:fragment="contenido">

    <div class="page-header">
        <h1>Asignar Roles</h1>
        <p>Define el nivel de acceso del estudiante en la plataforma</p>
    </div>

    <div class="card-custom" style="max-width:520px;">

        <div class="section-header">
            <div class="section-header-info">
                <h2>Roles disponibles</h2>
                <p>Selecciona uno o varios roles para este emprendedor</p>
            </div>
        </div>

        <form th:action="@{/usuarios/asignar-roles}" method="post">

            <input type="hidden" name="idUsuario" th:value="${usuario.idUsuario}"/>

            <div style="display:flex; flex-direction:column; gap:4px; margin-bottom:28px;">
                <div class="form-check" th:each="r : ${roles}">
                    <input class="form-check-input" type="checkbox" name="roles" th:value="${r.idRol}"/>
                    <label class="form-check-label" th:text="${r.nombre}"></label>
                </div>
            </div>

            <div style="display:flex; gap:10px; padding-top:20px; border-top:1px solid #E5E7EB;">
                <button type="submit" class="btn btn-success">
                    <i class="bi bi-check-lg"></i>
                    Guardar
                </button>
                <a href="/usuarios" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i>
                    Volver
                </a>
            </div>

        </form>
    </div>

</div>

</body>
</html>
