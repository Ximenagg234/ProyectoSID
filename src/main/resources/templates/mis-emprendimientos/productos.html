<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="contenido">

    <div class="page-header" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
        <div>
            <h1 th:text="'Productos — ' + ${emprendimiento.nombre}"></h1>
            <p>Gestiona el catálogo de tu emprendimiento</p>
        </div>
        <div style="display:flex;gap:8px;">
            <a th:href="@{'/mis-emprendimientos/' + ${emprendimiento.idEmprendimiento} + '/productos/nuevo'}"
               class="btn btn-primary">
                <i class="bi bi-plus-lg"></i> Nuevo Producto
            </a>
            <a th:href="@{/mis-emprendimientos}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Volver
            </a>
        </div>
    </div>

    <div th:if="${exito}"
         style="background:#DCFCE7;color:#15803D;border-radius:12px;padding:12px 16px;
                font-size:13.5px;margin-bottom:20px;display:flex;align-items:center;gap:8px;">
        <i class="bi bi-check-circle-fill"></i> <span th:text="${exito}"></span>
    </div>

    <div th:if="${#lists.isEmpty(productos)}"
         style="text-align:center;padding:60px 0;color:#9CA3AF;">
        <i class="bi bi-bag-x" style="font-size:40px;display:block;margin-bottom:12px;"></i>
        <p style="font-size:14px;font-weight:600;">Sin productos aún</p>
        <a th:href="@{'/mis-emprendimientos/' + ${emprendimiento.idEmprendimiento} + '/productos/nuevo'}"
           class="btn btn-primary" style="margin-top:12px;">Agregar producto</a>
    </div>

    <div th:if="${!#lists.isEmpty(productos)}"
         style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;">

        <div th:each="p : ${productos}"
             style="background:#fff;border-radius:14px;border:1px solid #E5E7EB;
                    box-shadow:0 1px 3px rgba(0,0,0,.05);overflow:hidden;">

            <div style="height:110px;display:flex;align-items:center;justify-content:center;
                        background:linear-gradient(135deg,#EEF2FF,#E0E7FF);">
                <i class="bi bi-bag-fill" style="font-size:40px;color:#6366F1;opacity:.6;"></i>
            </div>

            <div style="padding:14px;">
                <div style="font-size:14px;font-weight:700;color:#111827;margin-bottom:4px;"
                     th:text="${p.nombre}"></div>
                <div style="font-size:12px;color:#6B7280;margin-bottom:8px;
                            overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;"
                     th:text="${p.descripcion}"></div>
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                    <span style="font-size:15px;font-weight:800;color:#6366F1;">
                        $<span th:text="${#numbers.formatDecimal(p.precio,1,'COMMA',0,'POINT')}"></span>
                    </span>
                    <span style="font-size:11px;color:#6B7280;">
                        Stock: <strong th:text="${p.stockDisponible}"></strong>
                    </span>
                </div>
                <div style="display:flex;gap:6px;">
                    <a th:href="@{'/mis-emprendimientos/' + ${emprendimiento.idEmprendimiento} + '/productos/editar/' + ${p.idProducto}}"
                       class="btn btn-secondary btn-sm" style="flex:1;justify-content:center;">
                        <i class="bi bi-pencil"></i> Editar
                    </a>
                    <a th:href="@{'/mis-emprendimientos/' + ${emprendimiento.idEmprendimiento} + '/productos/eliminar/' + ${p.idProducto}}"
                       class="btn btn-secondary btn-sm"
                       style="color:#EF4444;"
                       onclick="return confirm('¿Eliminar este producto?')">
                        <i class="bi bi-trash3"></i>
                    </a>
                </div>
            </div>
        </div>

    </div>

</div>
</body>
</html>
