<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<div th:fragment="contenido">

    <div class="page-header">
        <h1>Asignar Permisos</h1>
        <p>Define las acciones que puede realizar este rol</p>
    </div>

    <div class="card-custom" style="max-width:520px;">

        <div class="section-header">
            <div class="section-header-info">
                <h2>Permisos disponibles</h2>
                <p>Marca los permisos que tendrá este rol</p>
            </div>
        </div>

        <form th:action="@{/roles/asignar-permisos}" method="post">

            <input type="hidden" name="idRol" th:value="${rol.idRol}"/>

            <div style="display:flex; flex-direction:column; gap:4px; margin-bottom:28px;">
                <div class="form-check" th:each="p : ${permisos}">
                    <input class="form-check-input" type="checkbox" name="permisos" th:value="${p.idPermission}"/>
                    <label class="form-check-label" th:text="${p.nombre}"></label>
                </div>
            </div>

            <div style="display:flex; gap:10px; padding-top:20px; border-top:1px solid #E5E7EB;">
                <button type="submit" class="btn btn-success">
                    <i class="bi bi-check-lg"></i>
                    Guardar
                </button>
                <a href="/roles" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i>
                    Volver
                </a>
            </div>

        </form>
    </div>

</div>

</body>
</html>
