<div th:fragment="contenido">

    <div class="card-custom">
        <h4>Crear Rol</h4>
        <form th:action="@{/roles}" th:object="${rol}" method="post">
            <div class="mb-3">
                <label>Nombre</label>
                <input type="text" th:field="*{nombre}" class="form-control"/>
            </div>
            <button class="btn btn-success">Guardar</button>
        </form>

    </div>

</div>
