<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>IcesiEmprende</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>

    <style>
        :root {
            --primary:       #6366F1;
            --primary-light: #818CF8;
            --primary-dark:  #4F46E5;
            --primary-bg:    #EEF2FF;
            --secondary:     #22C55E;
            --secondary-bg:  #DCFCE7;
            --danger:        #EF4444;
            --danger-bg:     #FEE2E2;
            --warning:       #F59E0B;
            --warning-bg:    #FEF3C7;
            --bg:            #F9FAFB;
            --sidebar-bg:    #111827;
            --sidebar-w:     260px;
            --text:          #111827;
            --text-muted:    #6B7280;
            --border:        #E5E7EB;
            --card-bg:       #FFFFFF;
            --radius-sm:     8px;
            --radius-md:     12px;
            --radius-lg:     16px;
            --radius-xl:     20px;
            --shadow-sm:     0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
            --shadow-md:     0 4px 16px rgba(0,0,0,.06), 0 2px 4px rgba(0,0,0,.04);
            --shadow-lg:     0 10px 32px rgba(0,0,0,.08), 0 4px 8px rgba(0,0,0,.04);
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            font-size: 14px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* ─── SIDEBAR ─────────────────────────────────────────── */
        .sidebar {
            width: var(--sidebar-w);
            height: 100vh;
            background: var(--sidebar-bg);
            position: fixed;
            top: 0; left: 0;
            display: flex;
            flex-direction: column;
            z-index: 100;
            overflow: hidden;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 22px 20px 18px;
            border-bottom: 1px solid rgba(255,255,255,.07);
        }

        .sidebar-brand-icon {
            width: 36px; height: 36px;
            background: var(--primary);
            border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        .sidebar-brand-icon i { color: #fff; font-size: 18px; }

        .sidebar-brand-text {
            font-size: 15px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -.4px;
        }

        .sidebar-brand-text span { color: var(--primary-light); }

        .sidebar-nav {
            flex: 1;
            padding: 14px 12px;
            overflow-y: auto;
        }

        .sidebar-section-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: rgba(255,255,255,.28);
            padding: 14px 10px 6px;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255,255,255,.52);
            padding: 10px 12px;
            border-radius: var(--radius-md);
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 500;
            margin-bottom: 2px;
            transition: background .18s, color .18s;
        }

        .sidebar-link i {
            font-size: 16px;
            width: 20px;
            text-align: center;
            flex-shrink: 0;
        }

        .sidebar-link:hover {
            background: rgba(255,255,255,.08);
            color: #fff;
        }

        .sidebar-link.active {
            background: var(--primary);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(99,102,241,.35);
        }

        .sidebar-footer {
            padding: 14px 12px 18px;
            border-top: 1px solid rgba(255,255,255,.07);
        }

        .sidebar-footer .sidebar-link {
            margin-bottom: 2px;
        }

        .sidebar-footer .sidebar-link.logout:hover {
            background: rgba(239,68,68,.1) !important;
            color: #FCA5A5 !important;
        }

        /* ─── MAIN CONTENT ────────────────────────────────────── */
        .main-content {
            margin-left: var(--sidebar-w);
            min-height: 100vh;
            background: var(--bg);
            display: flex;
            flex-direction: column;
        }

        /* ─── TOPBAR ──────────────────────────────────────────── */
        .topbar {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 13px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .topbar-search {
            position: relative;
            width: 280px;
        }

        .topbar-search i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
            pointer-events: none;
        }

        .topbar-search input {
            width: 100%;
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: 50px;
            padding: 8px 16px 8px 36px;
            font-size: 13px;
            font-family: inherit;
            color: var(--text);
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }

        .topbar-search input:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(99,102,241,.1);
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .topbar-notify {
            width: 36px; height: 36px;
            border-radius: var(--radius-md);
            border: 1.5px solid var(--border);
            background: var(--bg);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            color: var(--text-muted);
            transition: border-color .2s, color .2s;
        }

        .topbar-notify:hover { border-color: var(--primary); color: var(--primary); }

        .topbar-user {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 12px 5px 6px;
            border-radius: 50px;
            border: 1.5px solid var(--border);
            background: var(--bg);
            cursor: pointer;
        }

        .topbar-avatar {
            width: 28px; height: 28px;
            background: var(--primary);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
        }

        .topbar-username {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }

        .topbar-status {
            font-size: 10.5px;
            color: var(--secondary);
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 500;
        }

        .topbar-status::before {
            content: '';
            width: 5px; height: 5px;
            background: var(--secondary);
            border-radius: 50%;
            display: inline-block;
        }

        /* ─── PAGE CONTENT ────────────────────────────────────── */
        .page-content {
            flex: 1;
            padding: 32px;
        }

        /* ─── CARDS ───────────────────────────────────────────── */
        .card-custom {
            background: var(--card-bg);
            border-radius: var(--radius-xl);
            padding: 28px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        /* ─── METRIC CARDS ────────────────────────────────────── */
        .metric-card {
            background: var(--card-bg);
            border-radius: var(--radius-xl);
            padding: 22px 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 16px;
            transition: box-shadow .2s, transform .2s;
            height: 100%;
        }

        .metric-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .metric-icon {
            width: 52px; height: 52px;
            border-radius: var(--radius-lg);
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .metric-title {
            font-size: 11.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .7px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .metric-value {
            font-size: 28px;
            font-weight: 800;
            color: var(--text);
            line-height: 1;
            letter-spacing: -1px;
        }

        /* ─── PAGE HEADER ─────────────────────────────────────── */
        .page-header {
            margin-bottom: 24px;
        }

        .page-header h1 {
            font-size: 22px;
            font-weight: 800;
            color: var(--text);
            margin: 0 0 4px;
            letter-spacing: -.5px;
        }

        .page-header p {
            font-size: 13px;
            color: var(--text-muted);
            margin: 0;
        }

        /* ─── TABLES ──────────────────────────────────────────── */
        .table-wrapper {
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .table {
            margin: 0 !important;
            font-size: 13.5px;
        }

        .table thead th {
            background: #F3F4F6 !important;
            color: var(--text-muted) !important;
            font-size: 10.5px !important;
            font-weight: 700 !important;
            text-transform: uppercase !important;
            letter-spacing: .9px !important;
            padding: 11px 16px !important;
            border-bottom: 1px solid var(--border) !important;
            border-top: none !important;
            white-space: nowrap;
        }

        .table tbody td {
            padding: 14px 16px !important;
            vertical-align: middle !important;
            border-color: var(--border) !important;
            color: var(--text);
            font-weight: 500;
        }

        .table tbody tr { transition: background .15s; }

        .table tbody tr:hover td { background: #FAFAFA !important; }

        .table tbody tr:last-child td { border-bottom: none !important; }

        /* ─── SECTION HEADER (inside card) ───────────────────── */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .section-header-info h2 {
            font-size: 17px;
            font-weight: 800;
            color: var(--text);
            margin: 0 0 2px;
            letter-spacing: -.3px;
        }

        .section-header-info p {
            font-size: 12.5px;
            color: var(--text-muted);
            margin: 0;
        }

        /* ─── BUTTONS ─────────────────────────────────────────── */
        .btn {
            font-family: 'Plus Jakarta Sans', sans-serif !important;
            font-weight: 600 !important;
            border-radius: 50px !important;
            font-size: 13px !important;
            padding: 8px 18px !important;
            display: inline-flex !important;
            align-items: center !important;
            gap: 6px !important;
            transition: all .18s !important;
            border: none !important;
            letter-spacing: -.1px;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--primary) !important;
            color: #fff !important;
            box-shadow: 0 4px 12px rgba(99,102,241,.25) !important;
        }

        .btn-primary:hover, .btn-primary:focus {
            background: var(--primary-dark) !important;
            color: #fff !important;
            box-shadow: 0 6px 16px rgba(99,102,241,.35) !important;
            transform: translateY(-1px);
        }

        .btn-success {
            background: var(--secondary) !important;
            color: #fff !important;
            box-shadow: 0 4px 12px rgba(34,197,94,.22) !important;
        }

        .btn-success:hover, .btn-success:focus {
            background: #16A34A !important;
            color: #fff !important;
            box-shadow: 0 6px 16px rgba(34,197,94,.32) !important;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--bg) !important;
            color: var(--text-muted) !important;
            border: 1.5px solid var(--border) !important;
        }

        .btn-secondary:hover {
            background: #F3F4F6 !important;
            color: var(--text) !important;
        }

        .btn-outline-primary {
            background: var(--primary-bg) !important;
            color: var(--primary) !important;
            border: none !important;
        }

        .btn-outline-primary:hover {
            background: var(--primary) !important;
            color: #fff !important;
        }

        .btn-outline-danger {
            background: var(--danger-bg) !important;
            color: var(--danger) !important;
            border: none !important;
        }

        .btn-outline-danger:hover {
            background: var(--danger) !important;
            color: #fff !important;
        }

        .btn-sm {
            font-size: 12px !important;
            padding: 5px 14px !important;
        }

        /* ─── FORMS ───────────────────────────────────────────── */
        .form-label {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 6px;
        }

        .form-control, .form-select {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 13.5px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-md) !important;
            padding: 10px 14px;
            color: var(--text);
            background: var(--bg);
            transition: border-color .2s, box-shadow .2s;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99,102,241,.1);
            background: #fff;
            outline: none;
        }

        .form-control::placeholder { color: #9CA3AF; }

        .form-check { padding: 10px 14px; border-radius: var(--radius-md); transition: background .15s; }
        .form-check:hover { background: var(--primary-bg); }

        .form-check-input {
            width: 16px; height: 16px;
            border: 1.5px solid var(--border);
            cursor: pointer;
        }

        .form-check-input:checked {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        .form-check-label {
            font-size: 13.5px;
            font-weight: 500;
            color: var(--text);
            cursor: pointer;
        }

        /* ─── BADGES ──────────────────────────────────────────── */
        .badge-module {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .4px;
            text-transform: uppercase;
            background: var(--primary-bg);
            color: var(--primary-dark);
        }

        .badge-active {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            background: var(--secondary-bg);
            color: #15803D;
        }

        .badge-active::before {
            content: '';
            width: 5px; height: 5px;
            background: var(--secondary);
            border-radius: 50%;
        }

        /* ─── SCROLLBAR ───────────────────────────────────────── */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 10px; }
    </style>
</head>

<body>

<!-- ═══ SIDEBAR ══════════════════════════════════════════════════ -->
<aside class="sidebar">

    <div class="sidebar-brand">
        <div class="sidebar-brand-icon">
            <i class="bi bi-rocket-takeoff-fill"></i>
        </div>
        <div class="sidebar-brand-text">Icesi<span>Emprende</span></div>
    </div>

    <nav class="sidebar-nav">

        <div class="sidebar-section-label">Principal</div>

        <a th:href="@{/home}" class="sidebar-link">
            <i class="bi bi-grid-1x2"></i>
            Inicio
        </a>

        <!-- COMPRADOR o EMPRENDEDOR -->
        <div class="sidebar-section-label"
             sec:authorize="hasAnyRole('COMPRADOR','EMPRENDEDOR','ADMIN')">Marketplace</div>

        <a th:href="@{/marketplace}"
           class="sidebar-link"
           sec:authorize="hasAnyRole('COMPRADOR','EMPRENDEDOR','ADMIN')">
            <i class="bi bi-bag"></i>
            Marketplace
        </a>

        <a th:href="@{/carrito}"
           class="sidebar-link"
           sec:authorize="hasAnyRole('COMPRADOR','ADMIN')">
            <i class="bi bi-cart3"></i>
            Carrito
        </a>

        <a th:href="@{/pedidos/mis-pedidos}"
           class="sidebar-link"
           sec:authorize="hasAnyRole('COMPRADOR','ADMIN')">
            <i class="bi bi-bag-check"></i>
            Mis Pedidos
        </a>

        <!-- EMPRENDEDOR -->
        <div class="sidebar-section-label"
             sec:authorize="hasAnyRole('EMPRENDEDOR','ADMIN')">Mi Negocio</div>

        <a th:href="@{/mis-emprendimientos}"
           class="sidebar-link"
           sec:authorize="hasAnyRole('EMPRENDEDOR','ADMIN')">
            <i class="bi bi-rocket-takeoff"></i>
            Mis Emprendimientos
        </a>

        <a th:href="@{/pedidos/recibidos}"
           class="sidebar-link"
           sec:authorize="hasAnyRole('EMPRENDEDOR','ADMIN')">
            <i class="bi bi-inbox"></i>
            Pedidos Recibidos
        </a>

        <!-- ADMIN -->
        <div class="sidebar-section-label" sec:authorize="hasRole('ADMIN')">Administración</div>

        <a th:href="@{/usuarios}" class="sidebar-link" sec:authorize="hasRole('ADMIN')">
            <i class="bi bi-people"></i>
            Estudiantes
        </a>

        <a th:href="@{/roles}" class="sidebar-link" sec:authorize="hasRole('ADMIN')">
            <i class="bi bi-shield-check"></i>
            Roles
        </a>

    </nav>

    <div class="sidebar-footer">
        <a th:href="@{/perfil}" class="sidebar-link">
            <i class="bi bi-person-circle"></i>
            Mi Perfil
        </a>
        <a th:href="@{/logout}" class="sidebar-link logout">
            <i class="bi bi-box-arrow-left"></i>
            Cerrar Sesión
        </a>
    </div>

</aside>

<!-- ═══ MAIN ══════════════════════════════════════════════════════ -->
<div class="main-content">

    <!-- TOPBAR -->
    <header class="topbar">
        <div class="topbar-search">
            <i class="bi bi-search"></i>
            <input type="text" placeholder="Buscar emprendimientos, productos..."/>
        </div>

        <div class="topbar-right">
            <!-- Carrito (solo COMPRADOR) -->
            <a href="/carrito" sec:authorize="hasRole('COMPRADOR')"
               style="position:relative; width:36px; height:36px; border-radius:12px;
                      border:1.5px solid #E5E7EB; background:#F9FAFB;
                      display:flex; align-items:center; justify-content:center;
                      color:#6B7280; text-decoration:none; transition:border-color .2s, color .2s;"
               onmouseover="this.style.borderColor='#6366F1';this.style.color='#6366F1'"
               onmouseout="this.style.borderColor='#E5E7EB';this.style.color='#6B7280'">
                <i class="bi bi-cart3" style="font-size:15px;"></i>
            </a>
            <div class="topbar-notify">
                <i class="bi bi-bell"></i>
            </div>
            <a th:href="@{/perfil}" class="topbar-user" style="text-decoration:none;">
                <div class="topbar-avatar" id="topbarAvatar">
                    <img th:if="${currentUser != null and currentUser.fotoPerfil != null}"
                         th:src="${currentUser.fotoPerfil}"
                         style="width:100%;height:100%;object-fit:cover;border-radius:50%;"/>
                    <span th:if="${currentUser != null and currentUser.fotoPerfil == null}"
                          th:text="${#strings.substring(currentUser.nombreCompleto,0,2).toUpperCase()}"></span>
                    <i th:if="${currentUser == null}" class="bi bi-person-fill"></i>
                </div>
                <div>
                    <div class="topbar-username"
                         th:text="${currentUser != null ? currentUser.nombreCompleto : 'Estudiante'}"></div>
                    <div class="topbar-status">En línea</div>
                </div>
            </a>
        </div>
    </header>

    <!-- ═══ FRAGMENT: contenido ══════════════════════════════════
         El controlador pasa: model.addAttribute("contenido", "vista :: contenido")
         Thymeleaf reemplaza este div con el fragmento de la vista hija.
    ════════════════════════════════════════════════════════════ -->
    <main class="page-content" th:fragment="contenido">
        <div th:replace="~{__${contenido}__}">
            <!-- placeholder: reemplazado por el fragmento de la vista -->
        </div>
    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
