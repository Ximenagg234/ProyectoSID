<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="contenido">

    <div class="page-header">
        <h1>Pedidos Recibidos</h1>
        <p>Gestiona los pedidos de tus emprendimientos</p>
    </div>

    <!-- Mensaje flash -->
    <div th:if="${exito}"
         style="background:#DCFCE7; color:#15803D; border-radius:12px; padding:14px 18px;
                font-size:13.5px; font-weight:600; margin-bottom:24px;
                display:flex; align-items:center; gap:10px;">
        <i class="bi bi-check-circle-fill" style="font-size:18px;"></i>
        <span th:text="${exito}"></span>
    </div>

    <!-- Sin pedidos -->
    <div th:if="${#lists.isEmpty(pedidos)}"
         style="text-align:center; padding:80px 0;">
        <div style="width:80px; height:80px; background:#EEF2FF; border-radius:50%;
                    display:flex; align-items:center; justify-content:center; margin:0 auto 20px;">
            <i class="bi bi-inbox" style="font-size:36px; color:#6366F1;"></i>
        </div>
        <h3 style="font-size:18px; font-weight:700; color:#111827; margin-bottom:8px;">
            Sin pedidos por gestionar
        </h3>
        <p style="font-size:14px; color:#6B7280;">
            Cuando tus clientes realicen compras aparecerán aquí
        </p>
    </div>

    <!-- Tabla de pedidos -->
    <div th:if="${!#lists.isEmpty(pedidos)}"
         style="display:flex; flex-direction:column; gap:16px;">

        <div th:each="pedido : ${pedidos}"
             style="background:#fff; border-radius:16px; border:1px solid #E5E7EB;
                    box-shadow:0 1px 3px rgba(0,0,0,.05); overflow:hidden;">

            <!-- Header -->
            <div style="display:flex; align-items:center; justify-content:space-between;
                        padding:16px 20px; border-bottom:1px solid #F3F4F6; flex-wrap:wrap; gap:10px;">

                <div style="display:flex; align-items:center; gap:14px;">
                    <div style="font-size:13px; font-weight:700; color:#6366F1;">
                        #PED-<span th:text="${pedido.idPedido}"></span>
                    </div>
                    <div style="font-size:12.5px; color:#6B7280;">
                        <i class="bi bi-person-fill"></i>
                        <span th:text="${pedido.usuario.nombreCompleto}"></span>
                    </div>
                    <div style="font-size:12px; color:#9CA3AF;">
                        <i class="bi bi-calendar3"></i>
                        <span th:text="${#dates.format(pedido.fechaPedido, 'dd/MM/yyyy HH:mm')}"></span>
                    </div>
                </div>

                <div style="display:flex; align-items:center; gap:12px;">
                    <!-- Badge estado -->
                    <span th:text="${pedido.estado?.nombre}"
                          th:style="${pedido.estado?.nombre == 'PENDIENTE' ? 'background:#FEF9C3; color:#854D0E;' : (pedido.estado?.nombre == 'CONFIRMADO' ? 'background:#DBEAFE; color:#1E40AF;' : (pedido.estado?.nombre == 'PREPARANDO' ? 'background:#EDE9FE; color:#5B21B6;' : (pedido.estado?.nombre == 'ENTREGADO' ? 'background:#DCFCE7; color:#15803D;' : (pedido.estado?.nombre == 'CANCELADO' ? 'background:#FEE2E2; color:#B91C1C;' : 'background:#F3F4F6; color:#374151;'))))}"
                          style="font-size:11px; font-weight:700; padding:4px 10px;
                                 border-radius:50px; text-transform:uppercase; letter-spacing:.5px;">
                    </span>

                    <span style="font-size:16px; font-weight:800; color:#111827;">
                        $<span th:text="${#numbers.formatDecimal(pedido.total, 1, 'COMMA', 0, 'POINT')}"></span>
                    </span>
                </div>
            </div>

            <!-- Productos -->
            <div style="padding:14px 20px; border-bottom:1px solid #F3F4F6;">
                <div th:each="detalle : ${pedido.detalles}"
                     style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
                    <div style="width:36px; height:36px; background:#EEF2FF; border-radius:8px;
                                display:flex; align-items:center; justify-content:center; flex-shrink:0;">
                        <i class="bi bi-bag-fill" style="font-size:14px; color:#6366F1;"></i>
                    </div>
                    <div style="flex:1;">
                        <span style="font-size:13px; font-weight:600; color:#111827;"
                              th:text="${detalle.producto.nombre}"></span>
                        <span style="font-size:12px; color:#6B7280; margin-left:8px;">
                            x<span th:text="${detalle.cantidad}"></span>
                        </span>
                    </div>
                    <span style="font-size:13px; font-weight:700; color:#374151;">
                        $<span th:text="${#numbers.formatDecimal(detalle.subtotal, 1, 'COMMA', 0, 'POINT')}"></span>
                    </span>
                </div>
            </div>

            <!-- Cambiar estado -->
            <div style="padding:14px 20px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
                <span style="font-size:13px; font-weight:600; color:#374151;">Cambiar estado:</span>
                <form th:action="@{/pedidos/actualizar-estado}" method="post"
                      style="display:flex; align-items:center; gap:8px;">
                    <input type="hidden" name="idPedido" th:value="${pedido.idPedido}"/>
                    <select name="idEstado"
                            style="padding:7px 12px; border:1.5px solid #E5E7EB; border-radius:8px;
                                   font-size:13px; color:#111827; background:#F9FAFB;
                                   cursor:pointer; outline:none;">
                        <option th:each="estado : ${estados}"
                                th:value="${estado.idEstado}"
                                th:text="${estado.nombre}"
                                th:selected="${estado.idEstado == pedido.estado.idEstado}">
                        </option>
                    </select>
                    <button type="submit" class="btn btn-primary btn-sm">
                        <i class="bi bi-arrow-repeat"></i> Actualizar
                    </button>
                </form>
            </div>

        </div>
    </div>

</div>
</body>
</html>
