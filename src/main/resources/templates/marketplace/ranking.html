<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="contenido">

    <div class="page-header">
        <h1><i class="bi bi-trophy-fill" style="color:#F59E0B; margin-right:8px;"></i>Ranking de Emprendimientos</h1>
        <p>Los emprendimientos mejor calificados por la comunidad Icesi</p>
    </div>

    <a th:href="@{/marketplace}"
       style="display:inline-flex; align-items:center; gap:6px; font-size:13px;
              font-weight:600; color:#6B7280; text-decoration:none; margin-bottom:20px;">
        <i class="bi bi-arrow-left"></i> Volver al Marketplace
    </a>

    <div th:if="${ranking == null or ranking.isEmpty()}"
         style="text-align:center; padding:60px; color:#9CA3AF;">
        <i class="bi bi-trophy" style="font-size:48px; display:block; margin-bottom:12px;"></i>
        <p>Aún no hay emprendimientos calificados.</p>
    </div>

    <div th:if="${ranking != null and !ranking.isEmpty()}"
         class="card-custom" style="padding:0; overflow:hidden;">

        <!-- Podio top 3 -->
        <div style="background:linear-gradient(135deg,#1e1b4b,#312e81); padding:32px 24px; text-align:center; margin-bottom:0;">
            <div style="display:flex; align-items:flex-end; justify-content:center; gap:16px; flex-wrap:wrap;">

                <!-- 2do lugar -->
                <div th:if="${ranking.size() >= 2}"
                     style="display:flex; flex-direction:column; align-items:center; gap:8px; order:1;">
                    <div style="width:48px; height:48px; border-radius:50%; background:rgba(255,255,255,.15);
                                display:flex; align-items:center; justify-content:center; font-size:20px; color:#C0C0C0;">
                        🥈
                    </div>
                    <a th:href="@{'/marketplace/emprendimiento/' + ${ranking[1][0].idEmprendimiento}}"
                       style="font-size:13px; font-weight:700; color:#fff; text-decoration:none; text-align:center; max-width:100px;"
                       th:text="${ranking[1][0].nombre}"></a>
                    <div style="font-size:12px; color:rgba(255,255,255,.6);"
                         th:text="${#numbers.formatDecimal(ranking[1][1], 1, 1)} + ' ★'"></div>
                    <div style="height:80px; width:80px; background:rgba(192,192,192,.2); border-radius:12px 12px 0 0;
                                display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:800; color:#C0C0C0;">
                        2
                    </div>
                </div>

                <!-- 1er lugar -->
                <div th:if="${ranking.size() >= 1}"
                     style="display:flex; flex-direction:column; align-items:center; gap:8px; order:0;">
                    <div style="font-size:28px; animation:bounce 1s infinite;">👑</div>
                    <a th:href="@{'/marketplace/emprendimiento/' + ${ranking[0][0].idEmprendimiento}}"
                       style="font-size:15px; font-weight:800; color:#FDE68A; text-decoration:none; text-align:center; max-width:120px;"
                       th:text="${ranking[0][0].nombre}"></a>
                    <div style="font-size:13px; color:#FDE68A; font-weight:700;"
                         th:text="${#numbers.formatDecimal(ranking[0][1], 1, 1)} + ' ★'"></div>
                    <div style="height:110px; width:90px; background:rgba(253,230,138,.2); border-radius:12px 12px 0 0;
                                display:flex; align-items:center; justify-content:center; font-size:34px; font-weight:800; color:#FDE68A;">
                        1
                    </div>
                </div>

                <!-- 3er lugar -->
                <div th:if="${ranking.size() >= 3}"
                     style="display:flex; flex-direction:column; align-items:center; gap:8px; order:2;">
                    <div style="width:48px; height:48px; border-radius:50%; background:rgba(255,255,255,.15);
                                display:flex; align-items:center; justify-content:center; font-size:20px; color:#CD7F32;">
                        🥉
                    </div>
                    <a th:href="@{'/marketplace/emprendimiento/' + ${ranking[2][0].idEmprendimiento}}"
                       style="font-size:13px; font-weight:700; color:#fff; text-decoration:none; text-align:center; max-width:100px;"
                       th:text="${ranking[2][0].nombre}"></a>
                    <div style="font-size:12px; color:rgba(255,255,255,.6);"
                         th:text="${#numbers.formatDecimal(ranking[2][1], 1, 1)} + ' ★'"></div>
                    <div style="height:60px; width:80px; background:rgba(205,127,50,.2); border-radius:12px 12px 0 0;
                                display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:800; color:#CD7F32;">
                        3
                    </div>
                </div>
            </div>
        </div>

        <!-- Lista completa -->
        <div style="padding:0;">
            <div th:each="entry, iter : ${ranking}"
                 style="display:flex; align-items:center; gap:16px; padding:14px 24px;
                        border-bottom:1px solid #F3F4F6; transition:background .15s;"
                 onmouseover="this.style.background='#F9FAFB'"
                 onmouseout="this.style.background='transparent'">

                <!-- Posición -->
                <div style="width:32px; text-align:center; flex-shrink:0;">
                    <span th:if="${iter.index == 0}" style="font-size:18px;">🥇</span>
                    <span th:if="${iter.index == 1}" style="font-size:18px;">🥈</span>
                    <span th:if="${iter.index == 2}" style="font-size:18px;">🥉</span>
                    <span th:if="${iter.index > 2}"
                          style="font-size:14px; font-weight:700; color:#9CA3AF;"
                          th:text="${iter.index + 1}"></span>
                </div>

                <!-- Info emprendimiento -->
                <div style="flex:1; min-width:0;">
                    <a th:href="@{'/marketplace/emprendimiento/' + ${entry[0].idEmprendimiento}}"
                       style="font-size:14px; font-weight:700; color:#111827; text-decoration:none;
                              white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block;"
                       th:text="${entry[0].nombre}"></a>
                    <div style="font-size:12px; color:#6B7280; display:flex; align-items:center; gap:8px; margin-top:2px;">
                        <span th:text="${entry[0].categoria?.nombre}"></span>
                        <span>·</span>
                        <span th:text="${entry[0].usuario?.nombreCompleto}"></span>
                    </div>
                </div>

                <!-- Estrellas y puntuación -->
                <div style="display:flex; align-items:center; gap:8px; flex-shrink:0;">
                    <div style="display:flex; gap:2px;">
                        <i th:each="i : ${#numbers.sequence(1,5)}"
                           th:class="${i <= entry[1]} ? 'bi bi-star-fill' : 'bi bi-star'"
                           style="font-size:12px; color:#F59E0B;"></i>
                    </div>
                    <span style="font-size:14px; font-weight:800; color:#111827; min-width:28px;"
                          th:text="${entry[1] > 0 ? #numbers.formatDecimal(entry[1], 1, 1) : '–'}"></span>
                </div>

                <!-- Badge destacado -->
                <span th:if="${entry[0].destacado}"
                      style="font-size:10px; font-weight:700; background:#FEF9C3; color:#854D0E;
                             padding:3px 8px; border-radius:50px; flex-shrink:0;">
                    ⭐ Destacado
                </span>
            </div>
        </div>
    </div>

</div>

</body>
</html>
