<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<div th:fragment="contenido">

    <!-- Volver -->
    <a th:href="@{/marketplace}"
       style="display:inline-flex; align-items:center; gap:6px; font-size:13px;
              font-weight:600; color:#6B7280; text-decoration:none; margin-bottom:20px;">
        <i class="bi bi-arrow-left"></i> Volver al Marketplace
    </a>

    <!-- ── BANNER DEL EMPRENDIMIENTO ────────────────────────── -->
    <div th:style="'border-radius:20px; padding:28px 32px; margin-bottom:24px; overflow:hidden; position:relative; background: linear-gradient(135deg,' + (${emprendimiento.categoria?.nombre == 'Tecnologia' ? '#667eea,#764ba2' : (emprendimiento.categoria?.nombre == 'Moda' ? '#f093fb,#f5576c' : '#f7971e,#ffd200')}) + ');'">

        <div style="display:flex; align-items:center; gap:20px; position:relative; z-index:1;">

            <!-- Logo / ícono -->
            <div style="width:72px; height:72px; border-radius:16px; flex-shrink:0; overflow:hidden;">
                <img th:if="${emprendimiento.logoUrl != null}"
                     th:src="${emprendimiento.logoUrl}" alt="Logo"
                     style="width:100%; height:100%; object-fit:cover;"/>
                <div th:if="${emprendimiento.logoUrl == null}"
                     style="width:72px; height:72px; background:rgba(255,255,255,.2);
                            border-radius:16px; display:flex; align-items:center; justify-content:center;">
                    <i class="bi bi-rocket-takeoff-fill" style="font-size:32px; color:#fff;"></i>
                </div>
            </div>

            <div>
                <!-- Categoría -->
                <div style="font-size:11px; font-weight:700; text-transform:uppercase;
                            letter-spacing:.8px; color:rgba(255,255,255,.7); margin-bottom:4px;"
                     th:text="${emprendimiento.categoria.nombre}"></div>

                <!-- Nombre -->
                <h1 style="font-size:26px; font-weight:800; color:#fff; margin:0 0 6px;
                           letter-spacing:-.5px;"
                    th:text="${emprendimiento.nombre}"></h1>

                <!-- Meta -->
                <div style="display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
                    <span style="font-size:12.5px; color:rgba(255,255,255,.75); display:flex; align-items:center; gap:5px;">
                        <i class="bi bi-person-fill"></i>
                        <span th:text="${emprendimiento.usuario.nombreCompleto}"></span>
                    </span>
                    <span style="font-size:12.5px; color:rgba(255,255,255,.75); display:flex; align-items:center; gap:5px;">
                        <i class="bi bi-collection"></i>
                        <span th:text="${productos.size()} + ' productos'"></span>
                    </span>
                    <span style="font-size:12.5px; color:rgba(255,255,255,.75); display:flex; align-items:center; gap:5px;"
                          th:if="${emprendimiento.semestre != null}">
                        <i class="bi bi-calendar3"></i>
                        <span th:text="${emprendimiento.semestre.periodo}"></span>
                    </span>
                </div>
            </div>
        </div>

        <!-- Decoración fondo -->
        <i class="bi bi-rocket-takeoff-fill"
           style="position:absolute; right:32px; top:50%; transform:translateY(-50%);
                  font-size:96px; color:rgba(255,255,255,.08);"></i>
    </div>

    <!-- ── DESCRIPCIÓN ───────────────────────────────────────── -->
    <div class="card-custom" style="margin-bottom:24px; padding:20px 24px;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
            <i class="bi bi-info-circle" style="color:#6366F1;"></i>
            <span style="font-size:13px; font-weight:700; color:#111827;">Sobre nosotros</span>
        </div>
        <p style="font-size:13.5px; color:#6B7280; margin:0; line-height:1.7;"
           th:text="${emprendimiento.descripcion}"></p>
    </div>

    <!-- ── RESEÑAS ─────────────────────────────────────────── -->
    <div class="card-custom" style="margin-bottom:24px;">
        <div class="section-header" style="margin-bottom:16px;">
            <div class="section-header-info">
                <h2>Reseñas</h2>
                <p th:if="${calificaciones != null}"
                   th:text="${calificaciones.size()} + ' reseñas'"></p>
            </div>
            <!-- Promedio -->
            <div th:if="${promedio != null and promedio > 0}"
                 style="display:flex; align-items:center; gap:6px;">
                <span style="font-size:24px; font-weight:800; color:#111827;"
                      th:text="${#numbers.formatDecimal(promedio, 1, 1)}"></span>
                <div>
                    <div style="display:flex; gap:2px;">
                        <i th:each="i : ${#numbers.sequence(1,5)}"
                           th:class="${i <= promedio} ? 'bi bi-star-fill' : 'bi bi-star'"
                           style="font-size:14px; color:#F59E0B;"></i>
                    </div>
                    <div style="font-size:11px; color:#6B7280;">Calificación promedio</div>
                </div>
            </div>
        </div>

        <!-- Lista de reseñas existentes -->
        <div th:if="${calificaciones == null or calificaciones.isEmpty()}"
             style="text-align:center; padding:24px; color:#9CA3AF;">
            <i class="bi bi-chat-dots" style="font-size:32px; display:block; margin-bottom:8px;"></i>
            <p style="font-size:13px;">Aún no hay reseñas para este emprendimiento.</p>
        </div>

        <div th:if="${calificaciones != null and !calificaciones.isEmpty()}"
             style="display:flex; flex-direction:column; gap:12px; margin-bottom:20px;">
            <div th:each="cal : ${calificaciones}"
                 style="background:#F9FAFB; border-radius:12px; padding:14px 16px; border:1px solid #E5E7EB;">
                <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;">
                    <div style="display:flex; align-items:center; gap:8px;">
                        <div style="width:32px; height:32px; border-radius:50%; background:#EEF2FF;
                                    display:flex; align-items:center; justify-content:center;">
                            <i class="bi bi-person-fill" style="font-size:14px; color:#6366F1;"></i>
                        </div>
                        <span style="font-size:13px; font-weight:600; color:#111827;"
                              th:text="${cal.usuario?.nombreCompleto}"></span>
                    </div>
                    <div style="display:flex; gap:2px;">
                        <i th:each="i : ${#numbers.sequence(1,5)}"
                           th:class="${i <= cal.puntuacion} ? 'bi bi-star-fill' : 'bi bi-star'"
                           style="font-size:12px; color:#F59E0B;"></i>
                    </div>
                </div>
                <p th:if="${cal.comentario != null and !cal.comentario.isEmpty()}"
                   style="font-size:13px; color:#374151; margin:0; line-height:1.6;"
                   th:text="${cal.comentario}"></p>
                <div style="font-size:11px; color:#9CA3AF; margin-top:6px;"
                     th:text="${#dates.format(cal.fecha, 'dd/MM/yyyy')}"></div>
            </div>
        </div>

        <!-- Formulario para dejar reseña (solo si tiene pedidos ENTREGADO sin calificar) -->
        <div th:if="${pedidosParaCalificar != null and !pedidosParaCalificar.isEmpty()}"
             style="border-top:1px solid #E5E7EB; padding-top:20px;">
            <h3 style="font-size:14px; font-weight:700; color:#111827; margin:0 0 14px;">
                <i class="bi bi-pencil-square" style="color:#6366F1; margin-right:6px;"></i>
                Deja tu reseña
            </h3>
            <form th:action="@{/marketplace/calificar}" method="post">
                <input type="hidden" name="idEmprendimiento" th:value="${emprendimiento.idEmprendimiento}"/>

                <!-- Si hay varios pedidos entregados, mostrar selector -->
                <div th:if="${pedidosParaCalificar.size() > 1}" style="margin-bottom:12px;">
                    <label style="font-size:12px; font-weight:600; color:#374151; display:block; margin-bottom:6px;">
                        Pedido a calificar
                    </label>
                    <select name="idPedido"
                            style="width:100%; padding:8px 12px; border:1px solid #D1D5DB;
                                   border-radius:8px; font-size:13px; color:#374151;">
                        <option th:each="ped : ${pedidosParaCalificar}"
                                th:value="${ped.idPedido}"
                                th:text="'Pedido #PED-' + ${ped.idPedido}"></option>
                    </select>
                </div>
                <!-- Si solo hay uno, ocultarlo -->
                <input th:if="${pedidosParaCalificar.size() == 1}"
                       type="hidden" name="idPedido"
                       th:value="${pedidosParaCalificar[0].idPedido}"/>

                <!-- Estrellas -->
                <div style="margin-bottom:12px;">
                    <label style="font-size:12px; font-weight:600; color:#374151; display:block; margin-bottom:8px;">
                        Puntuación
                    </label>
                    <div style="display:flex; gap:8px;">
                        <th:block th:each="i : ${#numbers.sequence(1,5)}">
                            <label style="cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px;">
                                <input type="radio" name="puntuacion" th:value="${i}" required
                                       style="display:none;"
                                       th:id="'star' + ${i}"/>
                                <i class="bi bi-star-fill" th:id="'icon' + ${i}"
                                   style="font-size:26px; color:#D1D5DB; transition:color .15s;"
                                   th:attr="onclick='setStars(' + ${i} + ')',data-val=${i}"
                                   onmouseover="hoverStars(this.getAttribute('data-val'))"></i>
                                <span style="font-size:10px; color:#9CA3AF;" th:text="${i}"></span>
                            </label>
                        </th:block>
                    </div>
                </div>

                <!-- Comentario -->
                <div style="margin-bottom:14px;">
                    <label style="font-size:12px; font-weight:600; color:#374151; display:block; margin-bottom:6px;">
                        Comentario (opcional)
                    </label>
                    <textarea name="comentario" rows="3"
                              placeholder="¿Cómo fue tu experiencia con este emprendimiento?"
                              style="width:100%; padding:10px 12px; border:1px solid #D1D5DB;
                                     border-radius:8px; font-size:13px; color:#374151;
                                     resize:vertical; box-sizing:border-box;"></textarea>
                </div>

                <button type="submit"
                        style="background:#6366F1; color:#fff; border:none; border-radius:8px;
                               padding:9px 20px; font-size:13px; font-weight:600; cursor:pointer;
                               transition:background .18s;"
                        onmouseover="this.style.background='#4F46E5'"
                        onmouseout="this.style.background='#6366F1'">
                    <i class="bi bi-send-fill"></i> Enviar reseña
                </button>
            </form>
            <script>
                function setStars(val) {
                    for (let i = 1; i <= 5; i++) {
                        const icon = document.getElementById('icon' + i);
                        icon.style.color = i <= val ? '#F59E0B' : '#D1D5DB';
                        document.getElementById('star' + i).checked = (i == val);
                    }
                }
            </script>
        </div>

        <!-- Mensaje si ya calificó o no es comprador -->
        <div th:if="${pedidosParaCalificar == null or pedidosParaCalificar.isEmpty()}"
             sec:authorize="hasRole('COMPRADOR')"
             style="border-top:1px solid #E5E7EB; padding-top:14px;
                    font-size:12.5px; color:#9CA3AF; text-align:center;">
            <i class="bi bi-info-circle"></i>
            Podrás dejar una reseña cuando tengas un pedido entregado de este emprendimiento.
        </div>
    </div>

    <!-- ── PRODUCTOS DEL EMPRENDIMIENTO ─────────────────────── -->
    <div class="card-custom">
        <div class="section-header">
            <div class="section-header-info">
                <h2>Productos</h2>
                <p th:text="${productos.size()} + ' productos disponibles'"></p>
            </div>
        </div>

        <!-- Sin productos -->
        <div th:if="${productos.isEmpty()}"
             style="text-align:center; padding:40px 0; color:#9CA3AF;">
            <i class="bi bi-bag-x" style="font-size:36px; display:block; margin-bottom:10px;"></i>
            <p style="font-size:14px;">Este emprendimiento aún no tiene productos publicados.</p>
        </div>

        <!-- Grid de productos -->
        <div th:if="${!productos.isEmpty()}"
             style="display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:16px;">

            <div th:each="p : ${productos}"
                 style="background:#F9FAFB; border-radius:12px; overflow:hidden;
                        border:1px solid #E5E7EB; transition:box-shadow .2s, transform .2s;"
                 onmouseover="this.style.boxShadow='0 6px 20px rgba(0,0,0,.08)';this.style.transform='translateY(-2px)'"
                 onmouseout="this.style.boxShadow='none';this.style.transform='translateY(0)'">

                <!-- Imagen real o gradiente fallback -->
                <div style="height:120px; overflow:hidden;">
                    <img th:if="${p.imagenes != null and !p.imagenes.isEmpty()}"
                         th:src="${p.imagenes[0].urlImagen}"
                         style="width:100%; height:120px; object-fit:cover;" alt="Foto producto"/>
                    <div th:if="${p.imagenes == null or p.imagenes.isEmpty()}"
                         style="height:120px; display:flex; align-items:center; justify-content:center;
                                background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(99,102,241,.05));">
                        <i class="bi bi-bag-fill" style="font-size:36px; color:#6366F1; opacity:.6;"></i>
                    </div>
                </div>

                <div style="padding:12px;">
                    <div style="font-size:13.5px; font-weight:700; color:#111827; margin-bottom:6px;
                                white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"
                         th:text="${p.nombre}"></div>

                    <div style="font-size:12px; color:#6B7280; margin-bottom:10px; line-height:1.5;
                                overflow:hidden; display:-webkit-box; -webkit-line-clamp:2;
                                -webkit-box-orient:vertical;"
                         th:text="${p.descripcion}"></div>

                    <div style="display:flex; align-items:center; justify-content:space-between;">
                        <span style="font-size:14px; font-weight:800; color:#111827;">
                            $<span th:text="${#numbers.formatDecimal(p.precio, 1, 'COMMA', 0, 'POINT')}"></span>
                        </span>

                        <form th:action="@{/carrito/agregar}" method="post" style="margin:0;"
                              sec:authorize="hasRole('COMPRADOR')">
                            <input type="hidden" name="idProducto" th:value="${p.idProducto}"/>
                            <input type="hidden" name="cantidad" value="1"/>
                            <button type="submit"
                                    style="width:30px; height:30px; border-radius:50%; border:none;
                                           background:#6366F1; color:#fff; cursor:pointer;
                                           display:flex; align-items:center; justify-content:center;
                                           font-size:14px; transition:background .2s;"
                                    onmouseover="this.style.background='#4F46E5'"
                                    onmouseout="this.style.background='#6366F1'"
                                    title="Agregar al carrito">
                                <i class="bi bi-plus-lg"></i>
                            </button>
                        </form>
                    </div>

                    <!-- Stock badge -->
                    <div style="margin-top:6px;">
                        <span th:if="${p.stockDisponible > 0}"
                              style="font-size:11px; color:#15803D; background:#DCFCE7;
                                     padding:2px 8px; border-radius:50px; font-weight:600;">
                            <i class="bi bi-check-circle-fill"></i>
                            <span th:text="${p.stockDisponible} + ' en stock'"></span>
                        </span>
                        <span th:if="${p.stockDisponible == 0}"
                              style="font-size:11px; color:#B91C1C; background:#FEE2E2;
                                     padding:2px 8px; border-radius:50px; font-weight:600;">
                            <i class="bi bi-x-circle-fill"></i> Sin stock
                        </span>
                    </div>
                </div>
            </div>

        </div>
    </div>

</div>

</body>
</html>
